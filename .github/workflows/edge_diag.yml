name: EdgeOne 节点出口诊断

on:
  workflow_dispatch:   # 仅手动触发，一次性诊断

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 签发 token 并诊断节点出口
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, ssl, urllib.request
          DOMAIN = "tvbox-juxu-spegz3xv.edgeone.cool"
          PROJECT = "makers-lxb2wlvf61qz"
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          op = urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx))
          body = json.dumps({"Action":"DescribePagesEncipherToken","Region":"ap-guangzhou",
                             "ProjectId":PROJECT,"Text":DOMAIN}).encode()
          req = urllib.request.Request("https://pages-api.cloud.tencent.com/v1", data=body,
                  headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ["EDGEONE_TOKEN"]})
          with op.open(req, timeout=20) as r: d = json.loads(r.read().decode())
          resp = d.get("Data",{}).get("Response", d)
          tok, ts = resp["Token"], resp["Timestamp"]
          cookie = f"eo_token={tok}; eo_time={ts}"
          print("[auth] token 签发成功")

          # 自定义 opener：禁止自动重定向，观察 302
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  print(f"  [redirect] {code} -> {newurl}")
                  return None
          op2 = urllib.request.build_opener(
              urllib.request.HTTPSHandler(context=ctx), NoRedirect())

          url = f"https://{DOMAIN}/api?mode=diag"
          req2 = urllib.request.Request(url, headers={"Cookie":cookie,"User-Agent":"okhttp/3.12.0"})
          try:
              with op2.open(req2, timeout=30) as r:
                  print("[http] status:", r.status, "final url:", r.geturl())
                  out = r.read().decode()
                  print("[raw head]", out[:400])
          except urllib.error.HTTPError as e:
              print("[http error]", e.code, dict(e.headers))
              print(e.read().decode()[:400])
          PY
