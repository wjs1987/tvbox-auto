name: Pages Deploy Diag
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Pages project + deployments
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, urllib.request, urllib.error
          PROJECT = "makers-lxb2wlvf61qz"
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          def call(action, extra=None):
              body = {"Action": action, "Region": "ap-guangzhou", "ProjectId": PROJECT}
              if extra: body.update(extra)
              req = urllib.request.Request("https://pages-api.cloud.tencent.com/v1",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json",
                           "Authorization":"Bearer "+os.environ["EDGEONE_TOKEN"]})
              try:
                  with urllib.request.urlopen(req, timeout=25, context=ctx) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"http": e.code, "body": e.read().decode()[:400]}
              except Exception as e:
                  return {"err": str(e)[:200]}
          for a in ["DescribePagesProject", "DescribePagesDeployments", "DescribePagesProjects"]:
              d = call(a)
              print("=== "+a)
              print(json.dumps(d, ensure_ascii=False)[:1500])
          PY
      - name: EdgeOne CLI help
        run: |
          npm i -g edgeone >/dev/null 2>&1 || true
          edgeone --help 2>&1 | head -30
          edgeone pages deploy --help 2>&1 | head -30
