name: Pages API Probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe action names
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, urllib.request, urllib.error
          PROJECT = "makers-lxb2wlvf61qz"
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          def call(action):
              body = {"Action": action, "Region": "ap-guangzhou", "ProjectId": PROJECT}
              req = urllib.request.Request("https://pages-api.cloud.tencent.com/v1",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json",
                           "Authorization":"Bearer "+os.environ["EDGEONE_TOKEN"]})
              try:
                  with urllib.request.urlopen(req, timeout=20, context=ctx) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"http": e.code, "body": e.read().decode()[:200]}
              except Exception as e:
                  return {"err": str(e)[:120]}
          for a in ["CreatePagesDeployment","DescribePagesDeployment","DescribePagesDeploymentLogs",
                    "CreatePagesDeployHook","DescribePagesDeployHooks","CreatePagesApiToken",
                    "DescribePagesApiTokens","UpdatePagesProject","DeletePagesProject",
                    "DescribePagesEnvVars","CreatePagesEnvVar"]:
              d = call(a)
              code = d.get("Code")
              print(f"{a}: code={code} msg={str(d.get('Message'))[:60]} http={d.get('http')} keys={list(d.keys())}")
          PY
