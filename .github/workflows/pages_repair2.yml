name: Pages Repair2
on:
  workflow_dispatch: {}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy variants and check status
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, base64, io, zipfile, time, urllib.request, urllib.error
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          API = "https://pages-api.cloud.tencent.com/v1"
          PID = "makers-o6ymftyp74bq"   # 目标项目 tvbox-juxu（新建）

          def call(action, extra=None, tries=6):
              body = {"Action": action, "Region": "ap-guangzhou"}
              if PID: body["ProjectId"] = PID
              if extra: body.update(extra)
              data = json.dumps(body).encode()
              last = None
              for i in range(tries):
                  req = urllib.request.Request(API, data=data, headers={
                      "Content-Type":"application/json","Authorization":"Bearer "+os.environ["EDGEONE_TOKEN"]})
                  try:
                      with urllib.request.urlopen(req, timeout=90, context=ctx) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      last = {"http": e.code, "body": e.read().decode()[:200]}
                  except Exception as e:
                      last = {"err": str(e)[:120]}
                  time.sleep(3 + i*4)
              return last

          def zipdir(files):
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, "w", zipfile.ZIP_DEFLATED) as z:
                  for name, path in files:
                      z.write(path, name)
              return base64.b64encode(buf.getvalue()).decode()

          def deploy(tag, art):
              d = call("CreatePagesDeployment", {"Env":"Production","Artifact":art,"ArtifactType":"archive"})
              s = json.dumps(d, ensure_ascii=False)
              print(f"[{tag}] {s[:300]}")
              did = (d.get("Data", {}).get("Response", {}) or {}).get("DeploymentId")
              for _ in range(12):
                  time.sleep(8)
                  r = call("DescribePagesDeployments")
                  deps = (r.get("Data", {}).get("Response", {}) or {}).get("Deployments") or []
                  cur = next((x for x in deps if x.get("DeploymentId") == did), None)
                  if cur and cur.get("Status") in ("Success","Failed"):
                      print(f"[{tag}] status={cur['Status']} code={cur.get('Code')} used={cur.get('UsedInProd')} url={cur.get('ProjectUrl')}")
                      return cur.get("Status")
              print(f"[{tag}] 超时未完成")
              return "timeout"

          # A 静态站点（只 catalog + index）
          deploy("A-static", zipdir([("catalog.json","super-source/catalog.json"),
                                    ("index.html","super-source/index.html")]))

          # B 函数 + 内置 vendor，不含 package.json（避免构建期 npm install 失败）
          files = [("catalog.json","super-source/catalog.json"), ("index.html","super-source/index.html"),
                   ("functions/api.js","super-source/functions/api.js"),
                   ("functions/_vendor/edgeone-pages-blob.cjs","super-source/functions/_vendor/edgeone-pages-blob.cjs")]
          with open("/tmp/edgeone.json","w") as f:
              json.dump({"version":3,
                         "routes":[{"handle":"filesystem"},{"src":"^/api$","server-name":"edge"}],
                         "conf":{"headers":[],"redirects":[],"caches":[]}}, f)
          files.append(("edgeone.json","/tmp/edgeone.json"))
          deploy("B-func-nopkg", zipdir(files))

          # C 再带 package.json（若 B 失败，看是否依赖导致）
          files2 = files + [("package.json","super-source/package.json")]
          deploy("C-func-pkg", zipdir(files2))

          print("PROJECT:", json.dumps(call("DescribePagesProjects"), ensure_ascii=False)[:700])
          PY
