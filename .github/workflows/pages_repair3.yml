name: Pages Repair3
on:
  workflow_dispatch: {}
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Try files / targz payloads
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, base64, io, tarfile, time, urllib.request, urllib.error
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          API = "https://pages-api.cloud.tencent.com/v1"
          PID = "makers-o6ymftyp74bq"

          def call(action, extra=None, tries=5):
              body = {"Action": action, "Region": "ap-guangzhou", "ProjectId": PID}
              if extra: body.update(extra)
              data = json.dumps(body).encode()
              last=None
              for i in range(tries):
                  req = urllib.request.Request(API, data=data, headers={
                      "Content-Type":"application/json","Authorization":"Bearer "+os.environ["EDGEONE_TOKEN"]})
                  try:
                      with urllib.request.urlopen(req, timeout=90, context=ctx) as r:
                          return json.loads(r.read().decode())
                  except urllib.error.HTTPError as e:
                      last={"http":e.code,"body":e.read().decode()[:200]}
                  except Exception as e:
                      last={"err":str(e)[:120]}
                  time.sleep(2+i*3)
              return last

          html = base64.b64encode(b"<h1>ok</h1>").decode()
          variants = [
            ("files-Name-Content", {"Env":"Production","Files":[{"Name":"index.html","Content":html}]}),
            ("files-Path-Content", {"Env":"Production","Files":[{"Path":"index.html","Content":html}]}),
            ("files-FilePath-FileContent", {"Env":"Production","Files":[{"FilePath":"index.html","FileContent":html}]}),
          ]
          # tar.gz 包
          buf = io.BytesIO()
          with tarfile.open(fileobj=buf, mode="w:gz") as t:
              p="/tmp/index.html"; open(p,"w").write("<h1>ok</h1>"); t.add(p, arcname="index.html")
          variants.append(("targz-archive", {"Env":"Production","Artifact":base64.b64encode(buf.getvalue()).decode(),"ArtifactType":"archive"}))

          for tag, extra in variants:
              d = call("CreatePagesDeployment", extra)
              s = json.dumps(d, ensure_ascii=False)
              did = (d.get("Data",{}).get("Response",{}) or {}).get("DeploymentId")
              print(f"[{tag}] {s[:200]}")
              if not did: continue
              for _ in range(10):
                  time.sleep(6)
                  r = call("DescribePagesDeployments")
                  deps = (r.get("Data",{}).get("Response",{}) or {}).get("Deployments") or []
                  cur = next((x for x in deps if x.get("DeploymentId")==did), None)
                  if cur and cur.get("Status") in ("Success","Failed"):
                      print(f"[{tag}] -> {cur['Status']} code={cur.get('Code')}")
                      break
          PY
