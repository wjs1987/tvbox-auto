name: Pages Restore Probe
on:
  workflow_dispatch: {}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - name: Probe schema
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, ssl, base64, io, zipfile, urllib.request, urllib.error
          P = "makers-lxb2wlvf61qz"
          ctx = ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          def call(action, extra):
              body = {"Action": action, "Region": "ap-guangzhou", "ProjectId": P}
              body.update(extra)
              req = urllib.request.Request("https://pages-api.cloud.tencent.com/v1",
                  data=json.dumps(body).encode(),
                  headers={"Content-Type":"application/json","Authorization":"Bearer "+os.environ["EDGEONE_TOKEN"]})
              try:
                  with urllib.request.urlopen(req, timeout=25, context=ctx) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"http": e.code, "body": e.read().decode()[:300]}
              except Exception as e:
                  return {"err": str(e)[:150]}

          # 1) 项目还在不在
          print("PROJECTS:", json.dumps(call("DescribePagesProjects", {}), ensure_ascii=False)[:600])
          print("DEPLOYMENTS:", json.dumps(call("DescribePagesDeployments", {}), ensure_ascii=False)[:900])

          # 2) 准备一个最小 zip 工件
          buf = io.BytesIO()
          with zipfile.ZipFile(buf, "w") as z:
              z.writestr("index.html", "<h1>probe</h1>")
          art = base64.b64encode(buf.getvalue()).decode()

          # 3) 试探 CreatePagesDeployment 的参数结构
          tries = [
            ("archive-artifact", {"Env":"Production","Artifact":art,"ArtifactType":"archive"}),
            ("files-array",      {"Env":"Production","Files":[{"Name":"index.html","Content":base64.b64encode(b"<h1>probe</h1>").decode()}]}),
            ("zipbase64",        {"Env":"Production","ZipFile":art}),
            ("empty",            {"Env":"Production"}),
          ]
          for label, extra in tries:
              d = call("CreatePagesDeployment", extra)
              print(f"[{label}] -> {json.dumps(d, ensure_ascii=False)[:500]}")
          PY
