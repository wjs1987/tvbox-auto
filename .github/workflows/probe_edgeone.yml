name: probe-edgeone-readonly
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: DescribePagesProjects (read-only)
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          tok=os.environ["EDGEONE_TOKEN"]
          req=urllib.request.Request("https://pages-api.cloud.tencent.com/v1",
              data=json.dumps({"Action":"DescribePagesProjects","Region":"ap-guangzhou","Offset":0,"Limit":20}).encode(),
              headers={"Content-Type":"application/json","Authorization":"Bearer "+tok})
          try:
              r=json.load(urllib.request.urlopen(req,timeout=30))
          except Exception as e:
              print("ERR",repr(e)[:300]); raise SystemExit(0)
          print("RAW:", json.dumps(r, ensure_ascii=False)[:3000])
          PY
