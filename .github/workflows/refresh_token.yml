name: Refresh Super Source Token

on:
  schedule:
    - cron: '10 * * * *'   # 每小时第 10 分钟（token 有效期 3 小时，滚动续期）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 与 update.yml 用同一个组：两个工作流都要改写 latest.json，
  # 必须排队串行，否则并发 git pull --rebase 会互相顶掉导致生成结果丢失。
  group: tvbox-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mint fresh token and update latest.json
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python check_sources.py --refresh-super --out latest.json

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet latest.json; then
            echo "无变化，跳过提交"
          else
            git add latest.json
            git commit -m "chore: refresh super source token [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main -q && git push origin main -q && exit 0
              echo "第 $i 次推送失败，等待后重试"
              sleep 20
            done
            echo "推送失败（重试 5 次）"
            exit 1
          fi

      - name: Purge jsDelivr cache
        if: always()
        # token 每小时换一次，jsDelivr 的 @main 缓存却长达数小时。不刷新的话，
        # 客户端会拿到已经过期的 token，全网汇总直接 401（实测能差 9 小时）。
        run: |
          curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/WJS1987/tvbox-auto@main/latest.json" >/dev/null 2>&1 || true
