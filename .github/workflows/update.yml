name: Auto Update TV Config

on:
  schedule:
    # UTC 19:00 = 北京时间凌晨 3:00（GitHub 定时任务可能有 0~60 分钟延迟，属正常）
    - cron: '0 19 * * *'
  workflow_dispatch: {}  # 允许手动点按钮触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run source check
        run: |
          python check_sources.py config/tv.json --check --workers 30 --timeout 8
          # 把检测结果复制到仓库根目录的固定文件名，魔屏的地址永远不用改
          cp config/tv_clean.json latest.json
          cp config/tv_report.md report.md

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
          else
            git commit -m "auto update $(date -u +%Y-%m-%d)"
            git push
          fi
