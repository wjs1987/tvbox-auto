name: Auto Update TV Config

on:
  schedule:
    # UTC 19:00 = 北京时间凌晨 3:00（GitHub 定时任务可能有 0~60 分钟延迟，属正常）
    - cron: '0 19 * * *'
  workflow_dispatch: {}   # 允许手动触发
  push:
    branches: [main]      # 每次推送代码后自动跑一轮验证

permissions:
  contents: write

concurrency:
  # 手动触发与定时任务共用同一组，排队串行，避免两次作业同时改写
  # latest.json 时并发 rebase 互相顶掉（曾导致配置生成结果丢失）。
  group: tvbox-main
  cancel-in-progress: false  # 排队等待，不取消正在跑的作业

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Crawl + Test + Build latest.json
        run: |
          python check_sources.py --auto --workers 30 --timeout 8 --top 50

      - name: Validate configs
        # 两个配置文件都必须结构正确才允许提交，避免"修好一个、另一个挂掉"
        run: python validate_config.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
          else
            git commit -m "auto update $(date -u +%Y-%m-%d)"
            # 并发冲突（refresh_token 作业同时改 latest.json）时，一律保留本次新生成的版本：
            # -X ours 在 rebase 里指"正在重放的提交"，即刚跑出来的配置。
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main -q && git push origin main -q && exit 0
              git rebase --abort 2>/dev/null || true
              echo "第 $i 次推送失败，等待后重试"
              sleep 20
            done
            echo "推送失败（重试 5 次）"
            exit 1
          fi

      - name: Purge jsDelivr cache
        if: always()
        # jsDelivr 对 @main 分支有静态缓存（实测能落后 9~10 小时），配置更新后不主动刷新，
        # 用 jsDelivr 地址的客户端会拿到旧配置。
        run: |
          for f in latest.json kids.json live.txt; do
            curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/WJS1987/tvbox-auto@main/$f" >/dev/null 2>&1 || true
          done
