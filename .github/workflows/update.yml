name: Auto Update TV Config

on:
  schedule:
    # UTC 19:00 = 北京时间凌晨 3:00（GitHub 定时任务可能有 0~60 分钟延迟，属正常）
    - cron: '0 19 * * *'
  workflow_dispatch: {}   # 允许手动触发
  push:
    branches: [main]      # 每次推送代码后自动跑一轮验证

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: true   # 同时只跑一轮，防止两次运行撞车互相 rebase 冲突

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build live list (自建直播源)
        run: |
          # GitHub 机房在海外，测速结果不代表国内网络，这里只做抓取+归一化+去重
          # 输出 live_raw.json 仅作兜底；本地实测过的 live.json 优先级更高
          # 需要按国内网络测速择优时，本地跑：python build_live.py --test --test-urls 5 --isp mobile
          python build_live.py --out live_raw.json

      - name: Crawl + Test + Build latest.json
        env:
          EDGEONE_TOKEN: ${{ secrets.EDGEONE_TOKEN }}
        run: |
          python check_sources.py --auto --workers 30 --timeout 8
          # 目录同时复制到边缘函数部署目录（下次部署时同源秒级加载）
          cp -f super_catalog.json super-source/catalog.json 2>/dev/null || true

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "配置无变化，跳过提交"
          else
            git commit -m "auto update $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase origin main -q && git push origin main -q && exit 0
              sleep 15
            done
            echo "推送失败（重试 3 次）"
            exit 1
          fi
