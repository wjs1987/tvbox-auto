<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超级源 · 状态页</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa; color: #1f2937;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
    max-width: 560px; width: 100%; padding: 32px;
  }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #9ca3af; flex-shrink: 0; }
  .dot.ok { background: #10b981; box-shadow: 0 0 0 4px rgba(16,185,129,.15); }
  .dot.bad { background: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,.15); }
  h1 { font-size: 22px; font-weight: 600; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: #f9fafb; border-radius: 12px; padding: 16px; text-align: center; }
  .num { font-size: 28px; font-weight: 700; color: #2563eb; }
  .lbl { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .sec { font-size: 13px; color: #374151; line-height: 1.8; }
  .sec b { color: #111827; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .tag { background: #eff6ff; color: #2563eb; border-radius: 999px; padding: 3px 12px; font-size: 12px; }
  .foot { margin-top: 24px; padding-top: 16px; border-top: 1px solid #f3f4f6; font-size: 12px; color: #9ca3af; display: flex; justify-content: space-between; }
  .btn { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .err { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="dot" id="dot"></span>
    <h1 id="title">正在检测服务状态…</h1>
  </div>
  <div class="sub">TVBox 超级源 · 全网片单汇总 · 自动去重合并</div>
  <div class="stats">
    <div class="stat"><div class="num" id="total">–</div><div class="lbl">去重片单</div></div>
    <div class="stat"><div class="num" id="ups">–</div><div class="lbl">上游采集源</div></div>
    <div class="stat"><div class="num" id="cats">–</div><div class="lbl">影片分类</div></div>
  </div>
  <div class="sec">最近数据更新：<b id="updated">–</b></div>
  <div class="sec">数据来源：</div>
  <div class="tags" id="tags"></div>
  <div class="err" id="err">⚠ 接口无响应或 token 已过期（token 有效期约 3 小时，由流水线每小时自动续签）</div>
  <div class="foot">
    <span>本页为状态监测页，片单请在 OK影视 中浏览</span>
    <button class="btn" onclick="load()">刷新</button>
  </div>
</div>
<script>
async function load() {
  const dot = document.getElementById('dot'), title = document.getElementById('title'), err = document.getElementById('err');
  try {
    const r = await fetch('/api?mode=status', { cache: 'no-store' });
    if (!r.ok) throw 0;
    const d = await r.json();
    dot.className = 'dot ok';
    title.textContent = '服务运行中';
    document.getElementById('total').textContent = d.total ?? '–';
    document.getElementById('ups').textContent = (d.upstreams || []).length;
    document.getElementById('cats').textContent = 6;
    document.getElementById('updated').textContent = d.updated ? d.updated.replace('T', ' ').slice(0, 19) + ' UTC' : '构建中，请稍后刷新';
    document.getElementById('tags').innerHTML = (d.upstreams || []).map(u => `<span class="tag">${u}</span>`).join('') || '<span class="tag">等待首次构建</span>';
    err.style.display = 'none';
  } catch (e) {
    dot.className = 'dot bad';
    title.textContent = '接口异常';
    err.style.display = 'block';
  }
}
load();
</script>
</body>
</html>
