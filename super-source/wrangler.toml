name = "tvbox-super-source"
main = "src/index.js"
compatibility_date = "2024-11-01"

# 每天北京时间凌晨 3:00 自动重建汇总片单
[triggers]
crons = ["0 19 * * *"]

[[kv_namespaces]]
binding = "CATALOG"
# 部署前把下面两行替换为 `npx wrangler kv namespace create CATALOG` 输出的真实 id
id = "REPLACE_WITH_KV_ID"

[vars]
# 汇总片单取 latest.json 里排名前几的普通源（type 0/1）
MAX_UPSTREAMS = "6"
PAGES_PER_SOURCE = "2"
